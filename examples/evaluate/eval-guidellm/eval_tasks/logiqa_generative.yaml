task: logiqa_generative
dataset_path: hails/agieval-logiqa-en
dataset_name: null
output_type: generate_until
training_split: null
validation_split: null
test_split: test
doc_to_text: !function logiqa_generative_utils.doc_to_text
doc_to_target: !function logiqa_generative_utils.doc_to_target
generation_kwargs:
  until:
    - "\n"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_punctuation: true
    ignore_case: true
filter_list:
  - name: get_response
    filter:
      - function: regex
        regex_pattern: "([A-Da-d])"
      - function: take_first
metadata:
  version: 1.0
  protocol: custom_generative
