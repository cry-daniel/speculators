task: longbench_hotpotqa_local
dataset_path: parquet
dataset_kwargs:
  data_files:
    test: data/longbench_hotpotqa/test-00000-of-00001.parquet
test_split: test
output_type: generate_until
doc_to_text: !function longbench_hotpotqa_local_utils.doc_to_text
doc_to_target: "{{answers}}"
process_results: !function longbench_hotpotqa_local_utils.get_qa_f1_with_score
generation_kwargs:
  until: []
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
  - metric: qa_f1_score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0.1
  protocol: local_longbench_hotpotqa
