  all:
    - dense_ar
    - eagle3_dense
    - activation_aware
    - token_dense_t00
    - token_dense_t01
    - token_dense_t02
    - token_dense_t03
    - token_dense_t04
    - token_dense_t05
    - token_dense_t06
    - token_dense_t07
    - token_dense_t08
    - token_dense_t09
    - token_dense_t10

tasks:
  smoke:
    - gsm8k_cot
    - minerva_math500
    - gpqa_diamond_cot_zeroshot
    - ifeval
    - humaneval_instruct
    - longbench_multi_news
  all:
    - gsm8k_cot
    - minerva_math500
    - gpqa_diamond_cot_zeroshot
    - ifeval
    - humaneval_instruct
